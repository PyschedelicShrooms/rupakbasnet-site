<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Students coding at computers in the coding club">
  <defs>
    <symbol id="editor" viewBox="0 0 250 165">
      <rect width="250" height="165" rx="8" fill="#2f3bff"/>
      <g fill="#dfe4ff">
        <rect x="24" y="26" width="54" height="8" rx="4"/>
        <rect x="24" y="48" width="120" height="8" rx="4"/>
        <rect x="24" y="70" width="86" height="8" rx="4"/>
        <rect x="42" y="92" width="140" height="8" rx="4" opacity="0.72"/>
        <rect x="42" y="114" width="70" height="8" rx="4" opacity="0.72"/>
        <rect x="24" y="136" width="42" height="8" rx="4" opacity="0.55"/>
        <rect x="42" y="114" width="6" height="8" fill="#ffffff" opacity="0.95"/>
      </g>
    </symbol>
  </defs>

  <!-- room -->
  <rect width="1600" height="1000" fill="#dbe0f5"/>
  <circle cx="240" cy="120" r="420" fill="#e7ebfb"/>
  <circle cx="1420" cy="60" r="300" fill="#e2e7f9"/>
  <rect x="0" y="720" width="1600" height="280" fill="#ccd5f1"/>

  <!-- chalkboard brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M196 236 L140 300 L196 364"/>
    <path d="M1404 236 L1460 300 L1404 364"/>
  </g>

  <!-- desk one -->
  <g>
    <rect x="100" y="700" width="400" height="22" rx="10" fill="#b7c2e7"/>
    <rect x="100" y="722" width="400" height="170" fill="#c3cdec"/>
    <rect x="286" y="668" width="28" height="34" fill="#141311"/>
    <rect x="248" y="696" width="104" height="12" rx="6" fill="#141311"/>
    <rect x="175" y="505" width="250" height="165" rx="16" fill="#141311"/>
    <use href="#editor" x="187" y="517" width="226" height="141"/>
    <rect x="430" y="654" width="34" height="42" rx="6" fill="#141311"/>
    <rect x="438" y="646" width="18" height="8" rx="4" fill="#dfe4ff"/>
  </g>

  <!-- desk two -->
  <g>
    <rect x="600" y="700" width="400" height="22" rx="10" fill="#b7c2e7"/>
    <rect x="600" y="722" width="400" height="170" fill="#c3cdec"/>
    <rect x="786" y="668" width="28" height="34" fill="#141311"/>
    <rect x="748" y="696" width="104" height="12" rx="6" fill="#141311"/>
    <rect x="675" y="505" width="250" height="165" rx="16" fill="#141311"/>
    <use href="#editor" x="687" y="517" width="226" height="141"/>
    <rect x="900" y="678" width="70" height="22" rx="6" fill="#efe4d8"/>
  </g>

  <!-- desk three -->
  <g>
    <rect x="1100" y="700" width="400" height="22" rx="10" fill="#b7c2e7"/>
    <rect x="1100" y="722" width="400" height="170" fill="#c3cdec"/>
    <rect x="1286" y="668" width="28" height="34" fill="#141311"/>
    <rect x="1248" y="696" width="104" height="12" rx="6" fill="#141311"/>
    <rect x="1175" y="505" width="250" height="165" rx="16" fill="#141311"/>
    <use href="#editor" x="1187" y="517" width="226" height="141"/>
  </g>

  <!-- students, seen from behind -->
  <g>
    <rect x="216" y="748" width="168" height="260" rx="82" fill="#2b2925"/>
    <circle cx="300" cy="706" r="52" fill="#2b2925"/>
    <rect x="278" y="742" width="44" height="26" rx="10" fill="#3b372f"/>
  </g>
  <g>
    <rect x="712" y="740" width="176" height="268" rx="86" fill="#e8e2d6"/>
    <circle cx="800" cy="690" r="56" fill="#141311"/>
    <rect x="776" y="726" width="48" height="28" rx="12" fill="#cfc7b6"/>
    <path d="M744 690 a56 56 0 0 1 112 0 v-22 a56 56 0 0 0 -112 0 z" fill="#141311"/>
  </g>
  <g>
    <rect x="1216" y="752" width="168" height="256" rx="82" fill="#3b372f"/>
    <circle cx="1300" cy="712" r="50" fill="#141311"/>
    <rect x="1280" y="746" width="40" height="26" rx="10" fill="#efe4d8"/>
  </g>

  <!-- spare chair -->
  <g opacity="0.9">
    <rect x="1000" y="800" width="120" height="120" rx="26" fill="#b7c2e7"/>
    <rect x="1044" y="920" width="18" height="80" fill="#b7c2e7"/>
  </g>
</svg>
